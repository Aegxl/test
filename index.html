<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Яблоко</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff7ed; color: #26351f; font-family: Arial, sans-serif; }
        .card { max-width: 520px; padding: 48px 28px; text-align: center; }
        .apple { font-size: 110px; filter: drop-shadow(0 12px 8px #d9b89b); }
        h1 { margin: 12px 0; font-size: 46px; }
        p { margin: 0 auto 26px; max-width: 360px; color: #66705f; line-height: 1.6; }
        a { display: inline-block; padding: 12px 20px; border-radius: 24px; background: #d94b3d; color: white; text-decoration: none; font-weight: bold; }
        a:hover { background: #b9362d; }
    </style>
</head>
<body>
    <main class="card">
        <div class="apple">🍎</div>
        <h1>Яблоко</h1>
        <p>Сочное, хрустящее и простое. Маленький фрукт для большого настроения.</p>
        <a href="#facts">Узнать больше</a>
        <p id="facts">В яблоке много клетчатки и витаминов.</p>
    </main>
</body>
</html>
